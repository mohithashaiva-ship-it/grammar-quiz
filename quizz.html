<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Subject-Verb Quiz!</title>
    <style>
        body { font-family: 'Comic Sans MS', cursive, sans-serif; margin: 0; padding: 0; background: linear-gradient(to bottom, #ffecd2, #fcb69f); color: #333; text-align: center; }
        .container { max-width: 600px; margin: 20px auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        h1 { color: #ff6b6b; font-size: 2em; margin-bottom: 10px; }
        .question { font-size: 1.2em; margin: 20px 0; animation: fadeIn 0.5s; }
        .options { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .option { background: #f0f8ff; border: 2px solid #ddd; border-radius: 10px; padding: 10px; cursor: pointer; transition: all 0.3s; }
        .option:hover { background: #e0f7fa; border-color: #4fc3f7; }
        .option.selected { background: #c8e6c9; border-color: #4caf50; }
        .option.correct { background: #d4edda; border-color: #28a745; animation: bounce 0.5s; }
        .option.incorrect { background: #f8d7da; border-color: #dc3545; }
        button { padding: 10px 20px; border: none; border-radius: 10px; font-size: 1em; cursor: pointer; margin: 10px; transition: all 0.3s; }
        #submitBtn { background: #ff9800; color: white; }
        #submitBtn:hover { background: #e68900; }
        #nextBtn { background: #4caf50; color: white; display: none; }
        #nextBtn:hover { background: #388e3c; }
        #result { font-size: 1.5em; margin-top: 20px; display: none; }
        .progress { margin-bottom: 20px; }
        .progress-bar { width: 100%; height: 20px; background: #ddd; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(to right, #ff6b6b, #4ecdc4); width: 0%; transition: width 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px); } 60% { transform: translateY(-5px); } }
        .emoji { font-size: 2em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Fun Subject-Verb Quiz! 🎉</h1>
        <p>Let's rock those grammar rules! Answer one by one and see if you're a verb master. 😎</p>
        
        <div class="progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p>Question <span id="currentQ">1</span> of 5</p>
        </div>
        
        <div id="quizArea">
            <!-- Questions will be loaded here via JS -->
        </div>
        
        <button id="submitBtn" onclick="checkAnswer()">Submit Answer 🚀</button>
        <button id="nextBtn" onclick="nextQuestion()">Next Question ➡️</button>
        
        <div id="result">
            <p id="scoreText"></p>
            <p id="feedback"></p>
        </div>
    </div>

    <script>
        const questions = [
            {
                text: "1. Which sentence has correct subject-verb agreement? 🐶",
                options: ["The dog barks loudly.", "The dog bark loudly.", "The dogs barks loudly.", "The dogs bark loudly."],
                correct: 0
            },
            {
                text: "2. Choose the correct verb: 'The committee ___ meeting tomorrow.' 👥",
                options: ["is", "are", "was", "were"],
                correct: 0
            },
            {
                text: "3. What rule for compound subjects joined by 'and'? 🤝",
                options: ["They take a singular verb.", "They take a plural verb.", "They always take 'is'.", "They take no verb."],
                correct: 1
            },
            {
                text: "4. Which indefinite pronoun is always singular? 🔍",
                options: ["Few", "Many", "Each", "Both"],
                correct: 2
            },
            {
                text: "5. Fix: 'Neither the teacher nor the students ___ happy.' 📚",
                options: ["is", "are", "was", "were"],
                correct: 1
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOption = null;

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            const quizArea = document.getElementById('quizArea');
            quizArea.innerHTML = `
                <div class="question">${q.text}</div>
                <div class="options">
                    ${q.options.map((opt, idx) => `<div class="option" onclick="selectOption(${idx})">${opt}</div>`).join('')}
                </div>
            `;
            selectedOption = null;
            document.getElementById('submitBtn').style.display = 'inline-block';
            document.getElementById('nextBtn').style.display = 'none';
            updateProgress();
        }

        function selectOption(idx) {
            const options = document.querySelectorAll('.option');
            options.forEach((opt, i) => {
                opt.classList.remove('selected');
                if (i === idx) opt.classList.add('selected');
            });
            selectedOption = idx;
        }

        function checkAnswer() {
            if (selectedOption === null) {
                alert("Pick an answer first! 🤔");
                return;
            }
            const q = questions[currentQuestionIndex];
            const options = document.querySelectorAll('.option');
            options.forEach((opt, i) => {
                if (i === q.correct) {
                    opt.classList.add('correct');
                } else if (i === selectedOption) {
                    opt.classList.add('incorrect');
                }
            });
            if (selectedOption === q.correct) {
                score++;
            }
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'inline-block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('currentQ').textContent = currentQuestionIndex + 1;
        }

        function showResult() {
            document.getElementById('quizArea').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            document.getElementById('scoreText').innerHTML = `You scored ${score} out of 5! 🎯`;
            let feedback = "";
            if (score === 5) {
                feedback = "Wow, you're a grammar superstar! 🌟 Keep shining!";
            } else if (score >= 3) {
                feedback = "Not bad! You're on your way to verb victory. 💪";
            } else {
                feedback = "Oops, time for some grammar practice! 📖 Try again!";
            }
            document.getElementById('feedback').innerHTML = feedback;
        }

        // Start the quiz
        loadQuestion();
    </script>
</body>
</html>
